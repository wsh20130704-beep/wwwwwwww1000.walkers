<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演示登录 · 创意工坊</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f8fc;background:radial-gradient(circle at 20% 5%,#33275b,#090d18 45%,#080a12)}.card{width:min(440px,100%);padding:30px;background:#151b2ddd;border:1px solid #ffffff20;border-radius:22px;box-shadow:0 24px 80px #0007}.brand{font-weight:900;font-size:14px;color:#a9b2c6}.brand b{color:#52dce8}.icon{width:54px;height:54px;border-radius:16px;background:#8b6cff24;display:grid;place-items:center;font-size:26px;margin:26px 0 16px}.heading{font-size:28px;margin:0 0 8px}.sub{color:#a9b2c6;margin:0 0 24px;line-height:1.55}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #ffffff20;border-radius:11px;background:#090d18;color:white;font:inherit;outline:none}input:focus{border-color:#9c73ff}.btn{width:100%;border:0;border-radius:11px;padding:13px;margin-top:8px;color:white;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#906fff,#634ad7)}.switch{margin-top:19px;text-align:center;color:#a9b2c6;font-size:14px}.switch button{border:0;background:none;color:#b29bff;font:inherit;cursor:pointer}.notice{margin-top:20px;padding:12px;border:1px solid #f3c96944;border-radius:10px;background:#f3c9690d;color:#e9d8a8;font-size:12px;line-height:1.55}.status{display:none;margin:16px 0;padding:14px;border-radius:11px;background:#42d99a16;border:1px solid #42d99a40;color:#a9f0cf;line-height:1.5}.status button{display:block;margin-top:10px;border:0;border-radius:9px;padding:9px 13px;background:#ffffff16;color:white;cursor:pointer}.back{display:inline-block;margin-top:20px;color:#b29bff;text-decoration:none}
</style></head>
<body><main class="card"><div class="brand">wwwwwwww1000<b>.walkers</b></div><div class="icon">✦</div><h1 class="heading" id="heading">欢迎回来</h1><p class="sub" id="sub">登录演示账户，体验创意工坊。</p><div id="form"><div class="field"><label for="username">用户名</label><input id="username" autocomplete="username" placeholder="输入任意用户名"></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="输入任意密码"></div><button class="btn" id="submit">演示登录</button><div class="switch" id="switch">还没有账户？ <button type="button">创建演示账户</button></div></div><div class="status" id="status"></div><div class="notice">这是前端演示登录，不会验证真实身份，也不会保存密码。登录状态仅保存在当前浏览器中；请勿输入真实密码或敏感信息。</div><a class="back" href="index.html">← 返回创意工坊</a></main>
<script>
const $=s=>document.querySelector(s);let registering=false;
function show(){const name=localStorage.getItem('creative_demo_user');if(name){$('#form').style.display='none';$('#heading').textContent='已登录';$('#sub').textContent='演示登录状态';$('#status').style.display='block';$('#status').innerHTML='你好，'+escapeText(name)+'！你正在使用本地演示账户。<button id="logout">退出登录</button>';$('#logout').onclick=()=>{localStorage.removeItem('creative_demo_user');location.reload()}}}
function escapeText(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
$('#switch button').onclick=()=>{registering=!registering;$('#heading').textContent=registering?'创建演示账户':'欢迎回来';$('#sub').textContent=registering?'填写任意用户名和密码即可体验。':'登录演示账户，体验创意工坊。';$('#submit').textContent=registering?'创建并登录':'演示登录';$('#switch').innerHTML=registering?'已有账户？ <button type="button">返回登录</button>':'还没有账户？ <button type="button">创建演示账户</button>';$('#switch button').onclick=()=>{registering=!registering;location.reload()}};
$('#submit').onclick=()=>{const name=$('#username').value.trim(),password=$('#password').value;if(!name||!password){alert('请填写用户名和密码');return}localStorage.setItem('creative_demo_user',name);show()};show();
</script></body></html>
