<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wwwwwwww1000.walkers 创意工坊</title><link rel="preconnect" href="https://fonts.googleapis.com"><style>:root{--bg:#090d18;--card:#151b2d;--line:#ffffff18;--text:#f7f8fc;--muted:#a9b2c6;--purple:#9c73ff;--cyan:#4dd8e8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 0,#31275a 0,#090d18 32%,#080a12 100%);min-height:100vh}.nav{height:72px;padding:0 max(24px,6vw);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900}.brand i{color:var(--cyan);font-style:normal}.nav span{color:var(--muted);font-size:13px}.shell{width:min(1180px,92vw);margin:32px auto}.hero{text-align:center;margin-bottom:26px}.hero h1{font-size:clamp(34px,6vw,58px);margin:0}.hero h1 em{font-style:normal;background:linear-gradient(90deg,#af91ff,#52dde8);background-clip:text;color:transparent}.hero p{color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);border-radius:12px;background:#ffffff09;color:var(--muted);padding:12px 6px;cursor:pointer}.tab.active{background:linear-gradient(135deg,#8061dc,#5545af);color:white}.panel{display:none;background:#151b2dcc;border:1px solid var(--line);border-radius:18px;padding:24px}.panel.active{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#090d18;color:white;font:inherit;outline:none}textarea{min-height:126px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;color:white;cursor:pointer}.primary{background:linear-gradient(135deg,#906fff,#634ad7)}.secondary{background:#ffffff12}.preview{background:#090d18;border:1px solid var(--line);border-radius:14px;min-height:280px;padding:18px;display:flex;align-items:center;justify-content:center}.output{width:100%;max-height:480px;overflow:auto;white-space:pre-wrap;line-height:1.75}.qrbox{width:220px;height:220px;background:white;border-radius:10px;display:grid;place-items:center;color:#64748b}.chat{width:100%;height:390px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:6px}.message{max-width:82%;margin:8px 0;padding:10px 12px;border-radius:12px;line-height:1.5}.bot{background:#252d45}.user{background:#7254cf;margin-left:auto}.chatbar{display:flex;gap:8px}.chatbar input{flex:1}.music{color:#63dbe7;margin-top:10px}@media(max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}.panel.active{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero p{font-size:14px}.nav span{display:none}}</style></head><body><nav class="nav"><div class="brand">wwwwwwww1000<i>.walkers</i></div><span>创意生成平台</span></nav><main class="shell"><header class="hero"><h1>让灵感<em>立即成形</em></h1><p>二维码 · 歌曲 · 作文 · 故事 · AI 对话</p></header><div class="tabs"><button class="tab active" data-panel="qr">二维码</button><button class="tab" data-panel="music">生成歌曲</button><button class="tab" data-panel="essay">生成作文</button><button class="tab" data-panel="story">生成故事</button><button class="tab" data-panel="ai">AI 对话</button></div>
<section class="panel active" id="qr"><div><div class="field"><label>二维码内容</label><textarea id="qrText" placeholder="网址、文字、Wi-Fi 信息等"></textarea></div><div class="row"><div class="field"><label>前景色</label><input id="qrDark" type="color" value="#111827"></div><div class="field"><label>背景色</label><input id="qrLight" type="color" value="#ffffff"></div></div><div class="actions"><button class="btn primary" id="makeQr">生成二维码</button><button class="btn secondary" id="downloadQr">下载图片</button></div></div><div class="preview"><div class="qrbox" id="qrcode">预览区域</div></div></section>
<section class="panel" id="music"><div><div class="field"><label>歌曲主题</label><input id="songTheme" placeholder="例如：星空下的友谊"></div><div class="row"><div class="field"><label>曲风</label><select id="songStyle"><option>流行</option><option>民谣</option><option>电子</option><option>摇滚</option><option>古风</option></select></div><div class="field"><label>情绪</label><select id="songMood"><option>温暖</option><option>欢快</option><option>治愈</option><option>忧伤</option><option>励志</option></select></div></div><div class="actions"><button class="btn primary" id="makeSong">生成歌词与旋律</button><button class="btn secondary" id="playSong">播放旋律</button></div><div class="music" id="musicStatus"></div></div><div class="preview"><div class="output" id="songOutput">输入主题并点击生成。</div></div></section>
<section class="panel" id="essay"><div><div class="field"><label>作文题目</label><input id="essayTitle" placeholder="例如：那些温暖的瞬间"></div><div class="row"><div class="field"><label>文体</label><select id="essayType"><option>记叙文</option><option>议论文</option><option>说明文</option><option>散文</option></select></div><div class="field"><label>字数</label><select id="essayLength"><option value="800">约800字</option><option value="500">约500字</option><option value="1000">约1000字</option></select></div></div><div class="actions"><button class="btn primary" id="makeEssay">生成作文</button><button class="btn secondary" id="copyEssay">复制作文</button></div></div><div class="preview"><div class="output" id="essayOutput">输入题目，开始创作。</div></div></section>
<section class="panel" id="story"><div><div class="field"><label>故事主角与主题</label><textarea id="storyTheme" placeholder="例如：一只会说话的猫守护月亮"></textarea></div><div class="row"><div class="field"><label>故事类型</label><select id="storyType"><option>奇幻冒险</option><option>科幻未来</option><option>悬疑推理</option><option>温情童话</option><option>都市爱情</option></select></div><div class="field"><label>篇幅</label><select id="storyLength"><option>短篇</option><option>中篇</option><option>微小说</option></select></div></div><div class="actions"><button class="btn primary" id="makeStory">生成故事</button><button class="btn secondary" id="copyStory">复制故事</button></div></div><div class="preview"><div class="output" id="storyOutput">输入故事主题，开启想象。</div></div></section>
<section class="panel" id="ai"><div><div class="field"><label>角色设定</label><input id="aiRole" value="你是一位友好、专业、有创造力的AI助手"></div><div class="field"><label>快捷提问</label><div class="actions"><button class="btn secondary quick">帮我写一首诗</button><button class="btn secondary quick">给我一个创业点子</button><button class="btn secondary quick">解释量子力学</button></div></div></div><div class="preview" style="padding:10px"><div class="chat"><div class="messages" id="messages"><div class="message bot">你好！我是你的创意 AI 助手，有什么可以帮你？</div></div><div class="chatbar"><input id="chatInput" placeholder="输入问题..."><button class="btn primary" id="sendChat">发送</button></div></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#'+t.dataset.panel).classList.add('active')});function makeQR(){if(!$('#qrText').value.trim()){alert('请输入二维码内容');return}$('#qrcode').innerHTML='';new QRCode($('#qrcode'),{text:$('#qrText').value,width:220,height:220,colorDark:$('#qrDark').value,colorLight:$('#qrLight').value,correctLevel:QRCode.CorrectLevel.H})}$('#makeQr').onclick=makeQR;$('#downloadQr').onclick=()=>{const a=$('#qrcode canvas')||$('#qrcode img');if(!a){alert('请先生成二维码');return}const l=document.createElement('a');l.download='qrcode.png';l.href=a.tagName==='CANVAS'?a.toDataURL():a.src;l.click()};
let melody=[];$('#makeSong').onclick=()=>{const theme=$('#songTheme').value.trim()||'心中的方向',style=$('#songStyle').value,mood=$('#songMood').value;$('#songOutput').textContent=`《${theme}》\n\n曲风：${style} ｜ 情绪：${mood}\n\n[主歌]\n晨光轻轻落在窗前\n带着未说完的心愿\n${theme}在耳畔轻声呼唤\n让平凡的每一天闪闪发亮\n\n[副歌]\n向着未知的方向向前\n带着温柔继续走下去\n哪怕前路还有风雨\n只要心中还有光\n\n[尾声]\n我会记得${theme}\n记得属于我们的年华`;melody=[261.63,329.63,392,349.23,329.63,293.66,329.63,392];$('#musicStatus').textContent='歌词已生成，演示旋律已准备好'};$('#playSong').onclick=()=>{if(!melody.length)$('#makeSong').click();const Ctx=window.AudioContext||window.webkitAudioContext,ctx=new Ctx();melody.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime+i*.28);g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+i*.28+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.28+.25);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+i*.28);o.stop(ctx.currentTime+i*.28+.27)});$('#musicStatus').textContent='演示旋律正在播放'};
$('#makeEssay').onclick=()=>{const t=$('#essayTitle').value.trim()||'生活的意义',type=$($('#essayType').value);let body;if(type==='议论文')body=`${t}\n\n生活中，我们总会遇到各种选择和挑战，而${t}常常是在这些时刻逐渐显现的。真正重要的，并不是表面的热闹，而是事物背后的价值与力量。\n\n首先，理解${t}能够提醒我们珍惜当下。清晨的阳光、朋友的一句问候、一次认真完成的工作，这些平凡瞬间共同构成了生活的温度。\n\n其次，面对困难时，深入思考${t}可以帮助我们找到方向。困难不可怕，关键在于是否愿意从中汲取经验。坚持思考与尝试，成长就会悄然发生。\n\n因此，无论道路多么曲折，都不妨以积极的心态面对生活，让理想与现实一点一点靠近。`;else if(type==='说明文')body=`${t}\n\n要认识${t}，需要从观察、分析和实践三个方面着手。观察是认识事物的起点，分析能理清事物之间的联系，实践则是检验认识的标准。\n\n在日常生活中，掌握理解事物的方法，可以让学习和工作更有条理。保持好奇心、善于提问，并把知识运用到实际中，就能获得更加全面的认识。`;else body=`${t}\n\n清晨的光线落在桌面，我忽然想起曾经许下的一个愿望。关于${t}，许多人都有自己的理解，而我的故事藏在最平常的日子里。\n\n那天，我走在回家的路上。微风吹过树梢，带来花园里的淡淡香气。原本匆忙的脚步慢了下来，我发现生活并不止于目的地。路边的小花、雨滴、陌生人温和的微笑，都在告诉我：美好并不遥远。\n\n后来，我开始把注意力放在眼前。无论遇到什么，我都会停下来感受天空与风声。正是这些瞬间，让我慢慢懂得了${t}。岁月继续向前，而我愿意认真生活，把平凡的日子变成独一无二的回忆。`;$('#essayOutput').textContent=body};$('#copyEssay').onclick=()=>{const t=$('#essayOutput').textContent;if(t.includes('输入题目'))return;navigator.clipboard.writeText(t);alert('作文已复制')};
$('#makeStory').onclick=()=>{const theme=$('#storyTheme').value.trim()||'失落的星辰钥匙',type=$('#storyType').value,length=$('#storyLength').value;$('#storyOutput').textContent=`《${theme}》\n\n类型：${type} · ${length}\n\n第一章：不速之客\n很久以前，${theme}悄悄改变了世界。但普通人只记得那是一个寻常的夜晚。月光落进老旧的窗口，主角在桌前发现了一封没有署名的信。\n\n信中只有一句话：“真正的旅程，必须在黎明前开始。”\n\n第二章：越过边界\n主角跟随一张模糊的地图，穿过沉睡的森林、荒芜的车站和一座漂浮在云中的城堡。每一步都意味着新的选择，也让关于${theme}的真相逐渐浮现。\n\n第三章：关键抉择\n在旅途尽头，主角看见了最不愿相信的秘密：所谓的目标，其实一直都在等待被放下。为了守护重要的人、拯救即将消失的世界，他终于鼓起勇气作出决定。\n\n尾声\n当黎明到来，一切并没有完全结束。${theme}成了新的传说，而主角明白，真正的故事，始终由选择和勇气写成。`};$('#copyStory').onclick=()=>{const t=$('#storyOutput').textContent;if(t.includes('开启想象'))return;navigator.clipboard.writeText(t);alert('故事已复制')};
function chat(text){const box=$('#messages'),u=document.createElement('div');u.className='message user';u.textContent=text;box.appendChild(u);setTimeout(()=>{const b=document.createElement('div');b.className='message bot';let r='这是一个很有意思的问题。我们可以先梳理目标、背景和限制条件，再一步步制定方案。';if(/诗/.test(text))r='星河为墨夜为纸，\n心中万灯照远地；\n把平凡写进岁月里，\n便有春风伴你行。';else if(/创业|点子/.test(text))r='可以尝试一个“小而美”的社区兴趣工具：先为一个特定人群解决重复、琐碎的需求，再用最小版本测试反馈。建议先验证需求，再逐步开发。';else if(/量子/.test(text))r='量子力学描述微观粒子在测量前可以处于叠加状态；测量后结果会与概率规则相关。其核心是用量子态和演化规则计算可观测结果，而不是直接把微观世界想象成经典小球。';b.textContent=r;box.appendChild(b);box.scrollTop=box.scrollHeight},450)}$('#sendChat').onclick=()=>{const i=$('#chatInput');if(i.value.trim()){chat(i.value.trim());i.value=''}};$('#chatInput').onkeydown=e=>{if(e.key==='Enter')$('#sendChat').click()};$$('.quick').forEach(b=>b.onclick=()=>{$('#chatInput').value=b.textContent;$('#sendChat').click()});</script></body></html>
